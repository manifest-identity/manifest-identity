# SonarCloud analysis, run from the pipeline rather than by automatic
# analysis, so the coverage report the tests produce is imported and
# the scan runs on the same commit the other gates judged.
sonar.projectKey=manifest-identity_manifest-identity
sonar.organization=manifest-identity
sonar.projectName=manifest-identity
sonar.sources=manifest_identity,frontend
sonar.tests=tests
sonar.exclusions=manifest_identity/templates/**,frontend/app.css
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
# Coverage is measured on the application package: the frontend has
# no coverage tool of its own and is tested through the suite, so it
# is excluded from the coverage measure, not from the analysis.
sonar.coverage.exclusions=frontend/**
