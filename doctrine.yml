# Read by build-doctrine's scorer: the repository's kind decides which rules apply.
kind: application
invites_contributions: true
# Level 5 needs proof the gate fired. Each link is a failed run where it did.
proven:
  # The actions inventory refused a half-bumped CodeQL action pin.
  pinned-actions: https://github.com/manifest-identity/manifest-identity/actions/runs/33565119678
# Files that carry the old name as history, by name or by the phrase on
# the lines that may keep it (build-doctrine's check_names.py, D-035).
name_allowlist:
  - .vale/styles/Proselint/Cliches.yml
  - LICENSE
  - AGENTS.md
  - DECISIONS.md
  - README.md: Coming from a role-call checkout
  - manifest_identity/authorize/models.py
  - migrations/versions/0001_greenfield_on_the_neutral_model.py
