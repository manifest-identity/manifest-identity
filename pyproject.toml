# Tool configuration only. Dependencies live in requirements.in and are
# compiled with hashes into requirements.txt; this project is an
# application, not a distributable package.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E, F: correctness. I: import order. B: known bug patterns. UP: outdated
# idioms. S: security checks. ERA: commented-out code, which the standards
# forbid as a deferred-work marker in disguise.
select = ["E", "F", "I", "B", "UP", "S", "ERA"]

[tool.ruff.lint.per-file-ignores]
# Test functions assert; that is their job, not an assertion misuse.
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Dependency factories are FastAPI's idiom for defaults, not the
# mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "manifest_identity.core.deps.require_roles"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["manifest_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
