# Least privilege toward the orchestrator itself: each workload gets
# its own ServiceAccount with no permissions granted and no token
# mounted, because the application needs nothing from the Kubernetes
# API, and a token that is not in the pod cannot be stolen from it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: manifest-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  namespace: manifest-identity
automountServiceAccountToken: false
