# The namespace's traffic rules: everything denied, then the three
# flows the system actually has, named. Calico exists precisely to
# make these enforced statements rather than decoration (2.1), and the
# probes that prove each denial are in the README.
#
# Ingress to the application is open on its port because the reachable
# boundary is the kind port mapping, which binds to the loopback
# interface only (2.1); the cluster cannot know which host addresses
# are friendly, and the host already refuses everything nonlocal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: manifest-identity
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress
  namespace: manifest-identity
spec:
  podSelector:
    matchLabels:
      app: manifest-identity
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress
  namespace: manifest-identity
spec:
  podSelector:
    matchLabels:
      app: manifest-identity
  policyTypes: [Egress]
  egress:
    # The database, and nothing else but the resolver that finds it.
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress
  namespace: manifest-identity
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: manifest-identity
      ports:
        - port: 5432
