# Local development stack. Both images are digest-pinned. No credential
# lives in this file: the database password comes from .env, which git
# ignores; .env.example documents the shape.
#
# Least privilege applies to the container boundary, not only to code
# (D-042). Both services run with a read-only root filesystem, no
# capability escalation, and bounded memory and processor use; every
# claim is verifiable by command, and the commands are in the README.
services:
  db:
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_DB: rolecall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolecall -d rolecall"]
      interval: 2s
      timeout: 2s
      retries: 15
    # No published port: only the app container can reach the database.
    # Migration authoring from the host attaches with
    # `docker compose exec db psql` or a temporary override; a standing
    # listener is a standing surface.
    volumes:
      - dbdata:/var/lib/postgresql/data
    # The postgres entrypoint drops to its own user but needs these
    # five to take ownership of a fresh data volume and get there;
    # everything else is dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 512m
    cpus: 1.0

  # The migration step: the only holder of the owner credential, run
  # once per start, exiting when the schema and the runtime role's
  # grants are current (D-013, honored at D-051).
  migrate:
    build: .
    command: >
      sh -c "alembic upgrade head && python scripts/setup_db_roles.py"
    environment:
      ROLECALL_DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@db:5432/rolecall
      ROLECALL_OWNER_DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@db:5432/rolecall
      ROLECALL_APP_DB_PASSWORD: ${ROLECALL_APP_DB_PASSWORD:?set it in .env, see .env.example}
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  app:
    build: .
    environment:
      # The runtime role: rows, never schema.
      ROLECALL_DATABASE_URL: postgresql+psycopg://rolecall_app:${ROLECALL_APP_DB_PASSWORD:?set it in .env, see .env.example}@db:5432/rolecall
      ROLECALL_ADMIN_USERNAME: ${ROLECALL_ADMIN_USERNAME:-}
      ROLECALL_ADMIN_PASSWORD: ${ROLECALL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Serving HTTP as an unprivileged user needs no capability at all,
    # no writable code path, and no privilege escalation route. /tmp is
    # memory, so nothing an attacker writes survives a restart.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0

volumes:
  dbdata:
