<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="manifest-identity data flow working sketch">
  <!-- Working sketch under the diagram doctrine. Self-contained: system fonts, no external references.
       Redrawn September 29, 2026: two records come in by two kinds of door, the engine derives one
       and compares it with the other at every read, and campaigns, alerts, reports, and the read API
       carry the difference out. Nothing derived is stored. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b04f2e"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f6f5f2"/>
  <text x="40" y="36" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.5" fill="#57606a">MANIFEST-IDENTITY DATA FLOW, WORKING SKETCH</text>

  <!-- trust boundary -->
  <rect x="230" y="60" width="500" height="460" rx="8" fill="none" stroke="#b04f2e" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <text x="250" y="84" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.2" fill="#b04f2e" fill-opacity="0.8">APPLICATION, TRUST BOUNDARY: EVERY REQUEST THROUGH THE SESSION, THE ROLE MATRIX, THE SCOPE</text>

  <!-- left: what comes in -->
  <rect x="40" y="110" width="150" height="70" rx="6" fill="rgba(87,96,106,0.08)" stroke="#8a939e"/>
  <text x="115" y="134" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Provider files</text>
  <text x="115" y="150" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">seven natively, any</text>
  <text x="115" y="164" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">other through a table</text>

  <rect x="40" y="330" width="150" height="70" rx="6" fill="rgba(87,96,106,0.08)" stroke="#8a939e"/>
  <text x="115" y="354" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">People</text>
  <text x="115" y="370" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">the page, or a spreadsheet</text>
  <text x="115" y="384" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">of approvals</text>

  <!-- inside: the two doors -->
  <rect x="270" y="110" width="180" height="70" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="360" y="134" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Nine parsers, one door</text>
  <text x="360" y="150" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">bounded, in memory, refusing;</text>
  <text x="360" y="164" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">the vocabulary ends here</text>

  <rect x="270" y="330" width="180" height="70" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="360" y="354" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Authorization doors</text>
  <text x="360" y="370" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">form, file, from observed;</text>
  <text x="360" y="384" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">approver from the session</text>

  <!-- inside: the engine, focal -->
  <rect x="500" y="200" width="200" height="90" rx="6" fill="rgba(176,79,46,0.06)" stroke="#b04f2e"/>
  <text x="600" y="224" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Derive and compare</text>
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">state from the whole history;</text>
  <text x="600" y="254" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">findings; holds now, can obtain;</text>
  <text x="600" y="268" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#b04f2e">the delta, at every read, stored nowhere</text>

  <!-- inside: what the difference drives -->
  <rect x="500" y="410" width="200" height="70" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="600" y="434" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Campaigns and alerts</text>
  <text x="600" y="450" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">one decision per item, by a person;</text>
  <text x="600" y="464" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">every alert and delivery a record</text>

  <!-- right: the store and the outputs -->
  <rect x="770" y="110" width="160" height="70" rx="6" fill="rgba(36,41,46,0.05)" stroke="#57606a"/>
  <text x="850" y="134" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">PostgreSQL</text>
  <text x="850" y="150" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">observations, authorizations,</text>
  <text x="850" y="164" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">decisions; the audit chain</text>

  <rect x="770" y="300" width="160" height="60" rx="6" fill="rgba(36,41,46,0.03)" stroke="rgba(36,41,46,0.35)"/>
  <text x="850" y="324" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Reports, exports</text>
  <text x="850" y="340" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">the same computation the page shows</text>

  <rect x="770" y="420" width="160" height="60" rx="6" fill="rgba(36,41,46,0.03)" stroke="rgba(36,41,46,0.35)"/>
  <text x="850" y="444" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Read API</text>
  <text x="850" y="460" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">identities, delta, change feed</text>

  <!-- connectors -->
  <path d="M190,145 H264" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="137" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">import</text>

  <path d="M190,365 H264" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="357" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">authorize</text>

  <path d="M450,130 H742 Q750,130 750,138 V140 Q750,145 758,145 H764" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="122" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">observations, append only, never edited</text>

  <path d="M450,380 H742 Q750,380 750,372 V188 Q750,180 758,180 H764" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="398" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">authorizations, append only, superseded not edited</text>

  <path d="M770,170 H720 Q712,170 712,178 V226 Q712,234 704,234 H706" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="200" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">both records</text>

  <path d="M600,290 V404" fill="none" stroke="#b04f2e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="608" y="350" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#b04f2e">each difference, to the person who can answer it</text>

  <path d="M700,260 H742 Q750,260 750,268 V322 Q750,330 758,330 H764" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700,455 H764" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="706" y="447" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">per token</text>

  <path d="M500,445 H480 Q472,445 472,437 V300 Q472,292 464,292 H190 Q182,292 182,300 V322" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="286" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">decisions, one per item, with the audit line in the same transaction</text>

  <text x="40" y="540" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">the engine recommends with its reasons and never decides; a revocation it recommends becomes a work item for a person</text>
</svg>
