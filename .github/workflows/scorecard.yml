# OpenSSF Scorecard: an external rating of this repository's own
# security posture, published so the score is checkable rather than
# claimed. Its check list doubles as an audit of practices this project
# has not adopted yet; a dropped score is a finding.
name: scorecard

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 1"

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # The publish step proves the result came from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # The result is published to the public scorecard and read from
      # there. It is deliberately NOT uploaded into code scanning: these
      # are posture facts about the repository, several of them recorded
      # accepted risks (no second reviewer, fuzzing not yet at its
      # subphase), and uploading them made every pull request fail on
      # findings no pull request can fix. An alarm that is always red
      # teaches the eye to skip the alarm, which is the one thing a
      # security gate cannot afford (D-037).
