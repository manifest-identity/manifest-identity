# The release workflow (D-050). A signed version tag starts it; it
# builds the artifacts, generates the software bill of materials from
# the same hash-pinned tree every other job uses, checksums everything,
# publishes the GitHub release, and attests build provenance for every
# artifact through GitHub's attestation service, so a consumer can
# verify what was released and how it was built without trusting this
# repository's word:
#   gh attestation verify <artifact> -R manifest-identity/manifest-identity
name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release writes contents; the attestation needs the
      # identity token and the attestation store, and nothing here
      # needs anything else.
      contents: write
      id-token: write
      attestations: write
      # The container image publishes to this repository's package
      # registry under the same tag, so a consumer can pull instead of
      # build; the image digest is attested like every other artifact.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and publish the container image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME" | cut -d@ -f2)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: attest the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: install the audit tooling, hashes enforced
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir --require-hashes -r requirements-dev.txt
      - name: build the artifacts
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="manifest-identity-$GITHUB_REF_NAME/" -o "dist/manifest-identity-src-$GITHUB_REF_NAME.tar.gz" "$GITHUB_REF_NAME"
          tar -czf "dist/sample-data-$GITHUB_REF_NAME.tar.gz" sample-data
          # The large set ships here, never as a commit: a thousand
          # bulk identities per generation, deterministic, for load
          # work (the generator imports nothing outside the standard
          # library, so no install step precedes it).
          python3 -m manifest_identity.sample_data "$RUNNER_TEMP/sample-data-scaled" --scale 1000
          tar -czf "dist/sample-data-scaled-$GITHUB_REF_NAME.tar.gz" -C "$RUNNER_TEMP" sample-data-scaled
          "$RUNNER_TEMP/venv/bin/pip-audit" --require-hashes -r requirements.txt --format cyclonedx-json --output "dist/sbom-$GITHUB_REF_NAME.json"
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: attest build provenance for every artifact
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: attach the attestation bundle as a release asset
        # The provenance lives in the platform's attestation log, but
        # external raters and offline verifiers look for a signature
        # file among the release assets; the bundle is the same
        # attestations in a file, so both audiences read one truth.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/attestations-$GITHUB_REF_NAME.intoto.jsonl"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
