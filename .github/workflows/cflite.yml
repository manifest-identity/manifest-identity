# Fuzzing the two parsers that read files from other systems, on every
# pull request that could change them. ClusterFuzzLite builds the
# harnesses under fuzz/ with AddressSanitizer and runs each for a
# bounded time against inputs derived from the change; a crash fails
# the check with the reproducing input attached. The parsers already
# refuse malformed exports with named errors; what fuzzing hunts is the
# input that escapes those names and reaches an exception nobody wrote.
name: fuzz

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "rolecall/ingest/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/cflite.yml"
  schedule:
    - cron: "17 6 * * 1"

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: build the fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: run the fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: 180
          mode: code-change
          sanitizer: address
