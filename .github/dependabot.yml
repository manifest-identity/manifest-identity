# Dependabot watches what it can see: the Python tree, the workflow
# action pins, the Dockerfile base digest, and the compose file's
# digests. It cannot see container images embedded in workflow files or
# checksummed tool downloads; those pins are listed with their watchers
# in the digest-parity check and the close ritual. It only opens pull
# requests; nothing merges without the owner's approval, and after it
# the merge happens when every check passes (D-101). Its commit subjects carry
# the DEPS identifier so they read like every other subject here; the
# bodies are upstream release notes, which the message check skips.
#
# Bumps are grouped so a month's updates arrive as a few pull requests
# instead of one per package, and the cadence is monthly because these
# are version updates and not security ones: an advisory reaches this
# repository through Dependabot's security updates and GitHub's alerts,
# neither of which waits for this schedule (D-060). Every action moves
# in one group, so the actions arrive as one pull request a month;
# Python packages move as one tree because the hash lock is recompiled
# once either way. Moving to a new Python or PostgreSQL version is a
# decision made once a year, when the packages are ready, so Dependabot
# offers only updates within the pinned version (D-101). Each group still runs every gate, and
# the companion edits the gates demand (the README inventory rows, the
# digest twins) are made once per group rather than once per package.
version: 2
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 2
    directory: /
    commit-message:
      prefix: DEPS
    schedule:
      interval: monthly
    # A release waits a week before it is offered, so a compromised one
    # can be caught and pulled first; security updates do not wait.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directory: /
    commit-message:
      prefix: DEPS
    schedule:
      interval: monthly
    # A release waits a week before it is offered, so a compromised one
    # can be caught and pulled first; security updates do not wait.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: DEPS
    schedule:
      interval: monthly
    # A release waits a week before it is offered, so a compromised one
    # can be caught and pulled first; security updates do not wait.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    commit-message:
      prefix: DEPS
    schedule:
      interval: monthly
    # A release waits a week before it is offered, so a compromised one
    # can be caught and pulled first; security updates do not wait.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
