repos:
  - repo: local
    hooks:
      # TruffleHog with verification disabled: fast and fully offline, which
      # is what a commit-time check must be. The verified mode runs in
      # continuous integration instead. See DECISIONS.md D-002. The exclude
      # file keeps the scan off git-ignored tool directories, whose library
      # documentation is full of example credentials; nothing in them can
      # reach a commit, and alarms that are always false teach the eye to
      # skip the alarm.
      - id: trufflehog
        name: trufflehog secret scan
        entry: trufflehog filesystem . --no-verification --fail --exclude-paths=.trufflehog-exclude.txt
        language: system
        pass_filenames: false
      # Vale enforces the writing rules at commit time, so a violation never
      # reaches history. It needs Vale installed on the machine.
      # Vale's configuration maps markdown only; declaring more file
      # types here checked nothing and misstated the gate's coverage.
      - id: vale
        name: vale writing rules
        entry: vale
        language: system
        types_or: [markdown]
      # The docs-truth gate (D-031): status figures must match the journey
      # diagram, and claims once publicly false may never return.
      - id: docs-truth
        name: docs-truth status check
        entry: python3 scripts/check_docs_truth.py
        language: system
        pass_filenames: false
      # The digest homes gate: each image digest has one home and no copy.
      - id: digest-homes
        name: digest homes check
        entry: python3 scripts/check_digest_homes.py
        language: system
        pass_filenames: false
      # The actions inventory gate: the README's table of pinned actions
      # must match the workflows in both directions.
      - id: actions-inventory
        name: actions inventory check
        entry: python3 scripts/check_actions_inventory.py
        language: system
        pass_filenames: false
      # The scoring page is generated from a snapshot of the raters'
      # data; a page the snapshot does not produce is a page that
      # states a figure nobody read.
      - id: scoring-parity
        name: scoring page matches its snapshot
        entry: python3 scripts/render_scoring.py --check
        language: system
        pass_filenames: false
      # The writing rules apply to commit messages, which Vale never
      # reads; one message carried a banned frame past every file gate
      # before this existed.
      - id: commit-message-writing
        name: commit message writing rules
        entry: bash scripts/check_commit_message.sh
        language: system
        stages: [commit-msg]
      # The standards ban deferred-work stubs; this makes the ban a mechanism.
      # AGENTS.md states the rule so it names the markers, and this file
      # names them to match them, so both are excluded; the vendored
      # Calico manifest carries its upstream's own markers and is
      # third-party text this repository does not edit.
      - id: no-credentials-in-git-config
        name: no credentials in git configuration
        entry: bash scripts/check_git_config_credentials.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: no-deferred-work-markers
        name: forbid deferred-work markers
        entry: '\b(TODO|FIXME|HACK|XXX)\b'
        language: pygrep
        types: [text]
        exclude: '^(AGENTS\.md|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|deploy/kind/calico-v[0-9.]+\.yaml)$'
